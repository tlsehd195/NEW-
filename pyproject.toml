[project]
name = "aiinvest"
version = "0.1.0"
description = "Autonomous AI Investment System — Phase 4: Baseline Models + Persistent Storage"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
portfolio-optimization = [
    "skfolio>=1.2.1",
]
backtest-integrity-stats = [
    "purgedcv>=0.1.6",
]
market-calendars = [
    "exchange_calendars>=4.13.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
