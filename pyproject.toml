[project]
name = "aiinvest"
version = "0.1.0"
description = "Autonomous AI Investment System — see docs/PROJECT_STATUS.md for current progress"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]
# Session 38: scripts/generate_paper_performance_tearsheet.py only --
# never imported by src/, which stays pandas/numpy-free. Deliberately
# `quantstats`, NOT the "actively maintained" `quantstats-reloaded`
# fork an external evaluation report recommended: direct testing
# (ADR-0138) found quantstats-reloaded==0.1.0's reports.html() crashes
# with a real ValueError on the single-strategy/no-benchmark case --
# the exact case this project's own Paper Trading has (no S&P 500 data
# ingested, ADR-0005) -- while the original quantstats==0.0.81 does not.
reporting = [
    "quantstats>=0.0.81",
]
# scripts/verify_signal_ic_with_alphalens.py only -- same "src/ stays
# dependency-free" boundary as `reporting` above (ADR-0139).
research = [
    "alphalens-reloaded>=0.4.6",
]
# ADR-0151, Decision 1 -- src/risk/sizing.py only sizes one security at
# a time despite Phase 8's own "Portfolio Risk Engine" docstring; not
# yet wired into src/risk/ (separate, scheduled Phase work).
portfolio-optimization = [
    "skfolio>=1.2.1",
]
# ADR-0151, Decision 5 -- fills two independently-documented, deferred
# gaps at once: Purged K-Fold/Embargo (ADR-0008) and PBO/Deflated
# Sharpe Ratio computation (ADR-0031's evidence.py). Not yet wired into
# src/backtest/validation.py or src/strategy_research/evidence.py.
backtest-integrity-stats = [
    "purgedcv>=0.1.6",
]
# ADR-0151, Decision 7 -- src/data_infra/calendar.py's own hand-picked
# holiday sample is explicitly non-production-accurate (missing Korea's
# lunar holidays, most US federal holidays). Not yet wired in --
# TradingCalendar is already a Protocol for this exact swap.
market-calendars = [
    "exchange_calendars>=4.13.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
