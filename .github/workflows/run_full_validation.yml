# Runs scripts/run_long_horizon_validation.py (the full walk-forward +
# PBO/DSR candidate pipeline, including ml_tree, ADR-0192) against real
# price/fundamentals/insider catalogs that already exist -- collected
# for real in the account owner's own Google Colab session (Session 37)
# and, for the price+fundamentals pair, already confirmed complete
# there (87-symbol RESEARCH_UNIVERSE_STAGE4, 2010-01-01..2026-09-11).
#
# This workflow does NOT re-ingest anything -- GitHub-hosted runners
# have their own outbound network path (already verified for real by
# ingest_fama_french_factors.yml/ingest_insider_transactions_full.yml),
# but re-collecting 87 symbols x ~13 years from scratch would take many
# hours and duplicate work already done. Instead it downloads the
# already-collected catalogs from a GitHub Release (chosen over a
# workflow artifact specifically because artifacts expire after their
# retention window -- a Release asset does not expire on its own) and
# runs the validation pipeline against them directly.
#
# Expected Release assets (see this repo's README/CLAUDE.md for the
# exact upload steps), each a zip of the catalog DIRECTORY
# storage.config's StorageEngine expects (containing catalog.duckdb):
#   - price_catalog.zip           (scripts/ingest_real_market_data.py output -- required)
#   - fundamentals_catalog.zip    (scripts/ingest_fundamentals_data.py output -- required)
#   - insider_catalog.zip         (scripts/ingest_insider_transactions.py / merge_insider_
#                                   transaction_catalogs.py output -- optional here specifically
#                                   because it is not required in this release at all:
#                                   ingest_insider_transactions_full.yml auto-publishes its own
#                                   copy to a fixed "insider-transactions-catalog" release this
#                                   workflow falls back to; when neither has one, the
#                                   insider_buying candidate is skipped, same as omitting
#                                   --insider-db-path on the CLI)
#
# The resulting report is committed straight into the repo (docs/research/
# reports/), not left as a 90-day workflow artifact only -- account-owner
# request, 2026-09-24: relying on a Claude session (or anyone) coming back
# within 90 days to copy the result somewhere durable was identified as a
# real single point of failure, not a real safeguard.
#
# workflow_dispatch-only -- a real, potentially long (walk-forward across
# 30+ candidates), real-data validation run, never scheduled.
name: Run Full Strategy Validation (Real Data)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the GitHub Release holding price_catalog.zip / fundamentals_catalog.zip / (optional) insider_catalog.zip"
        type: string
        required: true
      universe:
        description: "Universe to validate (must match _UNIVERSES in run_long_horizon_validation.py)"
        type: string
        default: "RESEARCH_UNIVERSE"
      start:
        description: "Range start (YYYY-MM-DD) -- must not overlap strategy_research.locked_windows.TEST_1"
        type: string
        default: "2010-01-01"
      end:
        description: "Range end (YYYY-MM-DD) -- must not overlap TEST_1; default is TEST_1's own start, the boundary every prior real Stage-3/4 run has used"
        type: string
        default: "2023-04-28"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install project
        # market-calendars (ADR-0207): run_long_horizon_validation.py now
        # injects the real exchange_calendars-backed US calendar instead
        # of the rule-derived US_EQUITY_NYSE.
        run: pip install -e '.[market-calendars]'

      - name: Download price + fundamentals catalogs (required)
        env:
          GH_TOKEN: ${{ github.token }}
          # Independent audit finding (2026-09-24): a workflow_dispatch
          # `type: string` input must never be interpolated directly
          # into a `run:` block via `${{ }}` -- GitHub expands that
          # BEFORE the shell sees the script, turning a crafted input
          # into literal shell code rather than a quoted argument. This
          # workflow has `permissions: contents: write` and pushes
          # commits, making this a real, consequential injection target.
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p ./data
          gh release download "$RELEASE_TAG_INPUT" \
            --repo "${{ github.repository }}" \
            --pattern "price_catalog.zip" --pattern "fundamentals_catalog.zip" \
            --dir ./data --clobber
          unzip -q ./data/price_catalog.zip -d ./data/price_catalog
          unzip -q ./data/fundamentals_catalog.zip -d ./data/fundamentals_catalog
          test -f ./data/price_catalog/catalog.duckdb
          test -f ./data/fundamentals_catalog/catalog.duckdb

      - name: Download insider catalog (optional -- tries the given release, then the auto-published one)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # First choice: an insider_catalog.zip the account owner put in
          # their own release alongside price/fundamentals. Second
          # choice: ingest_insider_transactions_full.yml's own durable
          # Release (it publishes there automatically, unconditionally,
          # every time it completes a merge -- see that workflow's own
          # "Publish the combined catalog to a durable Release" step) --
          # this makes the insider_buying candidate work with zero
          # manual upload step, not just an optional convenience.
          if gh release download "$RELEASE_TAG_INPUT" \
              --repo "${{ github.repository }}" \
              --pattern "insider_catalog.zip" --dir ./data --clobber 2>/dev/null; then
            echo "Using insider_catalog.zip from release $RELEASE_TAG_INPUT."
          elif gh release download "insider-transactions-catalog" \
              --repo "${{ github.repository }}" \
              --pattern "insider_catalog.zip" --dir ./data --clobber 2>/dev/null; then
            echo "Using insider_catalog.zip from the auto-published insider-transactions-catalog release."
          else
            echo "No insider catalog found in either release -- insider_buying candidate will be skipped, same as omitting --insider-db-path."
            echo "INSIDER_FLAG=" >> "$GITHUB_ENV"
          fi
          if [ -f ./data/insider_catalog.zip ]; then
            unzip -q ./data/insider_catalog.zip -d ./data/insider_catalog
            echo "INSIDER_FLAG=--insider-db-path ./data/insider_catalog" >> "$GITHUB_ENV"
          fi

      - name: Build institutional-holdings catalog (optional -- from the committed 13F backfill CSV)
        run: |
          set -euo pipefail
          # backfill_institutional_holdings_from_sec_bulk.yml (ADR-0210)
          # commits this CSV; without it the institutional_ownership_change
          # candidate is skipped, same as omitting --institutional-db-path.
          CSV=docs/research/reference/institutional_holdings_combined.csv
          # --symbols: only the tickers the CSV actually covers (the CUSIP
          # map resolves 75 of 87) -- the ingest CLI exits 1 on any
          # requested symbol missing from the CSV.
          if [ -f "$CSV" ]; then
            python3 scripts/ingest_institutional_holdings.py \
              --source-name sec_13f_bulk_dataset \
              --combined-csv "$CSV" \
              --symbols $(tail -n +2 "$CSV" | cut -d, -f1 | sort -u) \
              --as-of "$(git log -1 --format=%cs -- "$CSV")" \
              --db-path ./data/institutional_catalog
            echo "INSTITUTIONAL_FLAG=--institutional-db-path ./data/institutional_catalog" >> "$GITHUB_ENV"
          else
            echo "No $CSV -- institutional_ownership_change candidate will be skipped."
            echo "INSTITUTIONAL_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Run the full walk-forward + PBO/DSR validation
        env:
          UNIVERSE_INPUT: ${{ inputs.universe }}
          START_INPUT: ${{ inputs.start }}
          END_INPUT: ${{ inputs.end }}
        run: |
          set -euo pipefail
          python3 scripts/run_long_horizon_validation.py \
            --universe "$UNIVERSE_INPUT" \
            --start "$START_INPUT" --end "$END_INPUT" \
            --db-path ./data/price_catalog \
            --fundamentals-db-path ./data/fundamentals_catalog \
            $INSIDER_FLAG \
            $INSTITUTIONAL_FLAG \
            --data-status REAL \
            --report-out ./validation_report.json

      - name: Upload the validation report (90-day quick-access copy)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: full-validation-report
          path: ./validation_report.json
          retention-days: 90
          if-no-files-found: warn

      # Durable copy, unconditional and automatic: a workflow artifact
      # expires after 90 days regardless of whether anyone -- human or
      # AI session -- ever comes back to read it and write it up
      # elsewhere. This commits the raw report straight into the repo
      # (git history, no expiry) every time this job produces one, with
      # no dependence on a Claude session or the account owner being
      # around to do it manually. This is the raw JSON, not a written
      # narrative addendum -- STRATEGY-VALIDATION-REPORT.md's prose
      # addenda still need a human/LLM's judgment to interpret what a
      # result means (RULE 0.8), but the underlying numbers themselves
      # are never solely at the mercy of a 90-day clock again.
      - name: Commit the report into the repo (durable, no expiry, no human step needed)
        if: always()
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          START_INPUT: ${{ inputs.start }}
          END_INPUT: ${{ inputs.end }}
        run: |
          set -euo pipefail
          if [ ! -f ./validation_report.json ]; then
            echo "No report produced this run -- nothing to commit."
            exit 0
          fi
          mkdir -p docs/research/reports
          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          DEST="docs/research/reports/full-validation-${TIMESTAMP}.json"
          cp ./validation_report.json "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "chore: record full validation report ($RELEASE_TAG_INPUT, ${START_INPUT}..${END_INPUT})"
          git push
