# Observe-only log of the 10-month SMA rule on SPY (ADR-0235, account
# owner's choice 2026-10-02). Weekdays at 14:00 UTC (23:00 KST); appends
# to docs/research/macro_observations/sma_10m.jsonl once per calendar
# month and posts to Discord when the state flips. Trading is not affected.
name: Observe SMA Rule (observe-only)

on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e .

      - name: Record the SMA rule reading
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python3 scripts/record_sma_observation.py \
            --log docs/research/macro_observations/sma_10m.jsonl --discord-on-flip

      - name: Commit the log if it changed
        run: |
          set -euo pipefail
          LOG=docs/research/macro_observations/sma_10m.jsonl
          if git diff --quiet -- "$LOG" && git ls-files --error-unmatch "$LOG" >/dev/null 2>&1; then
            echo "log unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$LOG"
          git commit -m "chore: record SMA rule observation"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
