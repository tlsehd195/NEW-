# One-shot reconnaissance (see scripts/recon_delisted_fallback_providers.py).
name: Recon delisted coverage of fallback price providers

on:
  workflow_dispatch: {}
  push:
    branches: [claude/project-thread-pemw8s]
    paths: [scripts/recon_delisted_fallback_providers.py, .github/workflows/recon_delisted_fallback_providers.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Probe providers
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python3 scripts/recon_delisted_fallback_providers.py
