# Read-only recon of two free, non-US exchange archive candidates for a new
# test window that doesn't touch the locked US windows: NSE (India) daily
# bhavcopy archives, and a TWSE (Taiwan) delisting dataset on data.gov.tw.
name: Recon Overseas Exchanges

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which source to probe"
        type: choice
        options:
          - nse_bhavcopy
          - twse_delisted
        default: nse_bhavcopy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Probe source
        env:
          TARGET_INPUT: ${{ inputs.target }}
        run: python3 scripts/recon_overseas_exchanges.py "$TARGET_INPUT"
