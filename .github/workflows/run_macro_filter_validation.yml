# Research-window validation of the macro filter (ADR-0220):
# scripts/run_macro_filter_validation.py on the real 2000+ price catalog
# and the real ALFRED macro store, both from GitHub Releases. GLD (the
# gold signal's input) is not in the price catalog, so it is fetched
# from Tiingo here (one request) into the runner's copy only.
#
# The report is committed to docs/research/reports/, like
# run_full_validation.yml does. workflow_dispatch-only.
name: Run Macro Filter Validation (Real Data)

on:
  workflow_dispatch:
    inputs:
      price_release_tag:
        description: "Release holding price_catalog.zip"
        type: string
        default: "research-price-catalog-stage5-2000"
      macro_release_tag:
        description: "Release holding macro_store.zip (publish_fred_macro_store.yml)"
        type: string
        default: "fred-macro-vintages-v1"
      start:
        description: "Range start (YYYY-MM-DD)"
        type: string
        default: "2000-01-01"
      end:
        description: "Range end (YYYY-MM-DD); must stay before TEST_2 (2020-08-28)"
        type: string
        default: "2020-08-27"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e '.[market-calendars]'

      - name: Download the price catalog and the macro store
        env:
          GH_TOKEN: ${{ github.token }}
          PRICE_TAG_INPUT: ${{ inputs.price_release_tag }}
          MACRO_TAG_INPUT: ${{ inputs.macro_release_tag }}
        run: |
          set -euo pipefail
          mkdir -p ./data
          gh release download "$PRICE_TAG_INPUT" --repo "${{ github.repository }}" \
            --pattern "price_catalog.zip" --dir ./data --clobber
          gh release download "$MACRO_TAG_INPUT" --repo "${{ github.repository }}" \
            --pattern "macro_store.zip" --dir ./data --clobber
          unzip -q ./data/price_catalog.zip -d ./data/price_catalog
          unzip -q ./data/macro_store.zip -d ./data/macro_store
          test -f ./data/price_catalog/catalog.duckdb
          test -f ./data/macro_store/catalog.duckdb

      - name: Re-stamp corporate-action available_time (ADR-0216)
        run: python3 scripts/repair_corporate_action_available_time.py --db-path ./data/price_catalog --apply

      - name: Fetch GLD bars (Tiingo, one symbol)
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          END_INPUT: ${{ inputs.end }}
        run: |
          set -euo pipefail
          python3 scripts/ingest_real_market_data.py --symbols GLD --tiingo-only \
            --tiingo-timeout-seconds 60 --start 2004-11-01 --end "$END_INPUT" \
            --db-path ./data/price_catalog --manifest-out ./gld_manifest.json

      - name: Run the validation
        env:
          START_INPUT: ${{ inputs.start }}
          END_INPUT: ${{ inputs.end }}
        run: |
          set -euo pipefail
          python3 -u scripts/run_macro_filter_validation.py \
            --price-db-path ./data/price_catalog --macro-db-path ./data/macro_store \
            --start "$START_INPUT" --end "$END_INPUT" --report-json ./macro_filter_report.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: macro-filter-validation-report
          path: ./macro_filter_report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Commit the report into the repo
        env:
          START_INPUT: ${{ inputs.start }}
          END_INPUT: ${{ inputs.end }}
        run: |
          set -euo pipefail
          mkdir -p docs/research/reports
          DEST="docs/research/reports/macro-filter-validation-$(date -u +%Y%m%dT%H%M%SZ).json"
          cp ./macro_filter_report.json "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "chore: record macro filter validation report (${START_INPUT}..${END_INPUT})"
          git push
