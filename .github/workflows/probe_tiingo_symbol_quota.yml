# One-shot probe: prints Tiingo's own answer for a symbol already fetched
# this month (AAPL) and for the three the 2026-09-28 extension run failed
# on (X, XEC, XL). See scripts/probe_tiingo_symbol_quota.py. Delete once
# the reason is recorded in ADR-0224.
name: Probe Tiingo Symbol Quota

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Ask Tiingo for four symbols
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
        run: python3 scripts/probe_tiingo_symbol_quota.py
