# One-time/on-demand discovery of the tenancy's existing OCI resources
# (compartments, availability domains, VCNs/subnets, ARM-compatible
# images) -- account owner's own request, 2026-09-24, needed before
# provisioning an Always Free Ampere A1 (VM.Standard.A1.Flex) instance
# for colibri (EXTERNAL_REPO_APPLICABILITY_REPORT.md priority 10).
# Every account's compartment/network/image IDs are its own -- this
# reads them rather than guessing or hardcoding a value from a
# different tenancy.
#
# Read-only: every `oci` call here is a `list`/`get`, never a `create`/
# `update`/`delete` -- no tenancy resource is mutated. Output is
# resource names/OCIDs/shapes only, never a secret value.
#
# 2026-09-26 addition: `provision_oci_colibri_runner.yml` has failed
# every real attempt since it was created with the same "Out of host
# capacity" error, and several secondary sources (news coverage, a
# thread on Oracle's own Cloud Customer Connect community forum, blog
# posts) report Oracle quietly cut the Always Free VM.Standard.A1.Flex
# allocation in 2026, enforced since 2026-08-18. Rather than trust that
# secondhand claim (or act on it by guessing new numbers), the added
# step here reads this tenancy's OWN real service limit for A1 directly
# from OCI's Limits API -- the actual number this account is entitled
# to, not a blog's claim about "new tenancies in general."
#
# `workflow_dispatch`-only, matching `verify_oci_authentication.yml`.
name: Discover OCI Resources

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Write OCI config from secrets (never echoed)
        env:
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          chmod 700 "$HOME/.oci"
          printf '%s\n' "$OCI_API_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"
          # Only the root compartment (the tenancy OCID itself) needs
          # to be known ahead of time -- every other step below reads
          # its own real answer instead of assuming a value.
          echo "TENANCY_OCID=$OCI_TENANCY_OCID" >> "$GITHUB_ENV"

      - name: List compartments (root + any sub-compartments)
        run: |
          set -euo pipefail
          echo "::group::Compartments"
          oci iam compartment list --compartment-id "$TENANCY_OCID" --compartment-id-in-subtree true \
            --all --query "data[].{name:name, id:id, state:\"lifecycle-state\"}" --output table
          echo "::endgroup::"

      - name: List availability domains for the configured region
        run: |
          set -euo pipefail
          echo "::group::Availability Domains"
          oci iam availability-domain list --compartment-id "$TENANCY_OCID" --output table
          echo "::endgroup::"

      - name: List VCNs and subnets in the root compartment
        run: |
          set -euo pipefail
          echo "::group::VCNs"
          oci network vcn list --compartment-id "$TENANCY_OCID" \
            --query "data[].{name:\"display-name\", id:id, state:\"lifecycle-state\"}" --output table
          echo "::endgroup::"
          echo "::group::Subnets"
          oci network subnet list --compartment-id "$TENANCY_OCID" \
            --query "data[].{name:\"display-name\", id:id, cidr:\"cidr-block\", public:\"prohibit-public-ip-on-vnic\"}" \
            --output table
          echo "::endgroup::"

      - name: Find an ARM-compatible (aarch64) Ubuntu image
        run: |
          set -euo pipefail
          echo "::group::Ubuntu ARM images (Canonical Ubuntu, aarch64)"
          oci compute image list --compartment-id "$TENANCY_OCID" \
            --operating-system "Canonical Ubuntu" \
            --query "data[?contains(\"display-name\", 'aarch64') || contains(\"display-name\", 'ARM')].{name:\"display-name\", id:id}" \
            --output table
          echo "::endgroup::"

      - name: List existing compute instances (so we don't double-provision)
        run: |
          set -euo pipefail
          echo "::group::Existing compute instances"
          oci compute instance list --compartment-id "$TENANCY_OCID" \
            --query "data[].{name:\"display-name\", shape:shape, state:\"lifecycle-state\"}" --output table
          echo "::endgroup::"

      - name: List region subscriptions (which regions can actually be used)
        run: |
          set -euo pipefail
          echo "::group::Region Subscriptions"
          # A tenancy's Always Free Ampere A1 quota is shared across every
          # subscribed region, not per-region -- retrying in a second
          # subscribed region is a real, commonly-used way to get past one
          # region's "Out of host capacity" without needing a second
          # account. A region NOT listed here has no capacity to retry
          # against at all until the tenancy actually subscribes to it
          # (a real, separate console action -- this workflow only reads).
          oci iam region-subscription list --tenancy-id "$TENANCY_OCID" \
            --query "data[].{region:\"region-name\", status:status, home:\"is-home-region\"}" --output table
          echo "::endgroup::"

      - name: Check this tenancy's REAL Ampere A1 service limit (not a blog post)
        env:
          AD_NAME_FOR_LIMITS: JRxU:AP-TOKYO-1-AD-1
        run: |
          set -euo pipefail
          echo "::group::Compute service limits containing 'a1' (this tenancy's own numbers)"
          # 2026-09-26: multiple secondary sources (InfoQ, Oracle's own
          # Cloud Customer Connect community forum, several blogs) report
          # Oracle quietly cut the Always Free VM.Standard.A1.Flex
          # allocation from 4 OCPU/24GB to 2 OCPU/12GB, enforced from
          # 2026-08-18 -- but provision_oci_colibri_runner.yml still
          # requests 4 OCPU/24GB (the spec colibri's own smallest usable
          # model actually needs, per ADR-0189: >=24GB RAM), and every
          # real launch attempt since then has failed with "Out of host
          # capacity" (a raw-capacity signal, not a quota-exceeded one).
          # This project's own discipline is to verify a claim like this
          # against the tenancy's own real numbers, not take a blog post's
          # word for it -- this step is that verification, not a guess.
          oci limits value list --compartment-id "$TENANCY_OCID" --service-name compute \
            --scope-type AD --availability-domain "$AD_NAME_FOR_LIMITS" \
            --query "data[?contains(to_string(name), 'a1') || contains(to_string(name), 'A1')]" \
            --output table
          echo "::endgroup::"

          echo "::group::Real-time resource availability for standard-a1-core-count"
          # If this exact limit name is wrong for this tenancy/API version,
          # the table above still has the real name(s) to use instead --
          # this call is a bonus, not the only source of truth.
          oci limits resource-availability get --service-name compute \
            --limit-name standard-a1-core-count --compartment-id "$TENANCY_OCID" \
            --availability-domain "$AD_NAME_FOR_LIMITS" --output table \
            || echo "(limit name 'standard-a1-core-count' did not resolve for this tenancy -- see the table above for the real name)"
          echo "::endgroup::"
