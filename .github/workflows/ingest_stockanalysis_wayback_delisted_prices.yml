# Real ingestion of sparse, point-in-time delisted-stock prices
# recovered from Wayback Machine snapshots of stockanalysis.com -- see
# scripts/ingest_stockanalysis_wayback_delisted_prices.py's own module
# docstring for the full real recon history (2026-09-19: confirmed
# real prices recoverable across 3 real site layouts spanning
# 2020-2026, confirmed the technique only applies to tickers removed
# from the S&P 500 in 2020 or later -- 142 of 623 real candidates,
# stockanalysis.com itself did not exist before ~2020).
#
# Fetches the real, live fja05680/sp500 interval CSV
# (raw.githubusercontent.com, confirmed reachable) to select candidates
# at run time rather than committing a generated list (this project's
# own "never commit a data file, regenerate from the live real source"
# convention, ADR-0120).
#
# `symbols` input: leave empty to auto-select the full real candidate
# set (~142 tickers, a real, moderate, rate-limited multi-hour run
# against a free shared archival service -- see the ingestion script's
# own rate-limiting comment); pass an explicit space-separated list
# (e.g. "AVB") for a small real verification run first.
#
# workflow_dispatch-only -- a real, potentially long, real-network run.
name: Ingest Stockanalysis.com Delisted Prices (via Wayback Machine)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated tickers, or leave empty to auto-select the full real 2020+-delisted candidate set"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e .

      - name: Fetch the real, live S&P 500 constituent-interval CSV
        if: inputs.symbols == ''
        # Batch J (independent audit, R3 P2-1): pinned to a specific
        # commit SHA, not the mutable `master` branch -- a third-party
        # repo push (malicious or accidental) can no longer change what
        # this fetch returns on the next run without this line changing
        # too. parse_ticker_intervals (src/data_infra/providers/
        # sp500_index_constituent_history.py) is the real fail-closed
        # defense against a bad `ticker` value in the content itself;
        # this pin is defense-in-depth against the content changing at
        # all between runs. Bump by re-running
        # `git ls-remote https://github.com/fja05680/sp500
        # refs/heads/master` and updating this SHA when a newer
        # constituent history is needed.
        run: |
          curl -sS -o sp500_ticker_start_end.csv \
            "https://raw.githubusercontent.com/fja05680/sp500/a2430f2af0c79ddf0748e91de11bdeb1616ab5a7/sp500_ticker_start_end.csv"

      - name: Select this run's real candidate symbols
        id: symbols
        run: |
          if [ -n "${{ inputs.symbols }}" ]; then
            echo "symbols=${{ inputs.symbols }}" >> "$GITHUB_OUTPUT"
          else
            echo "symbols=$(python3 scripts/select_delisted_candidates_since.py --sp500-intervals-csv sp500_ticker_start_end.csv --since 2020-01-01)" >> "$GITHUB_OUTPUT"
          fi

      - name: Ingest real Wayback-recovered prices
        run: |
          python3 scripts/ingest_stockanalysis_wayback_delisted_prices.py \
            --symbols ${{ steps.symbols.outputs.symbols }} \
            --as-of "$(date -u +%F)" \
            --db-path ./data/wayback_delisted_prices \
            --manifest-out wayback_ingestion_manifest.json

      - name: Upload the recovered-price catalog
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wayback-delisted-prices-catalog
          path: ./data/wayback_delisted_prices
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload the manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wayback-delisted-prices-manifest
          path: wayback_ingestion_manifest.json
          retention-days: 90
          if-no-files-found: ignore
