# Scheduled Paper Trading cycle (ADR-0082, supersedes the Oracle Cloud
# VM plan in ADR-0081 as the active hosting choice). Runs
# scripts/run_paper_trading_cycle.py --resume daily, matching the
# crontab line ADR-0075 already documents, but on a GitHub-hosted
# runner instead of a self-managed VM.
#
# State persistence (the reason GitHub Actions was originally set
# aside): GitHub Actions runners are ephemeral, so the market-data
# catalog (--db-path) and the paper trading ledger (--paper-store) --
# both DuckDB-backed directories -- would not survive between runs on
# their own. This workflow round-trips both as GitHub Actions
# artifacts (restored at the start of each run, re-uploaded at the
# end) rather than committing the DuckDB files themselves into git,
# preserving this repo's existing policy of never tracking
# *.duckdb/*.parquet files (see .gitignore). See ADR-0082 for the full
# design and its disclosed limitations (artifact retention, cron
# timing), and ADR-0085 for why ingestion requests only an incremental
# window (not the full range) from the restored catalog's own last
# known bar forward -- a real run found that always re-requesting the
# full ~2.5-year range exhausted the provider's rate limit partway
# through, leaving 10 symbols (including SPY) with zero bars that day.
#
# ADR-0149's own follow-up (external review, Session 38 continued):
# the paper-trading-store artifact's 90-day retention is this ledger's
# ONLY persistence -- 90+ consecutive days of scheduled-run failure
# would lose the whole order/fill/trade history with nothing to
# restore from. "Export and commit Paper Trading store backup" below
# closes that gap by committing a plain-JSON table dump (never the raw
# DuckDB file) to `backups/paper_trading_store/` on this same branch --
# a durable, git-native backup with no expiry, distinct from (and not
# a change to) the *.duckdb/*.parquet exclusion above.
#
# Session 37 (real-data DQ gap): "Ingest latest market data" below now
# also fails this job (non-zero exit) when today's real ingestion finds
# a CRITICAL-severity data quality issue (e.g. a non-finite price) --
# previously the exit code only reflected ingestion status, so a
# CRITICAL finding was recorded in the manifest and then silently never
# acted on, letting the corrupted bar reach "Run paper trading cycle"
# the same day. On that failure, "Run paper trading cycle" below is
# correctly skipped (it is not `if: always()`) -- the flagged bar is
# excluded from every future read of this catalog by default
# (DuckDBDataRepository.get_bars(), Phase 1 spec section 3.1
# QUALITY_REJECTED) but never deleted (Raw Immutability, section 17).
name: Paper Trading Daily Cycle

on:
  schedule:
    # 22:00 UTC, Mon-Fri. Deliberately later than ADR-0075's
    # un-timezone-qualified "21:30" example: 22:00 UTC is safely after
    # the latest possible US market close (21:00 UTC during EST)
    # year-round, rather than assuming a specific DST offset.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  # write (not read): "Export and commit Paper Trading store backup"
  # below pushes a JSON snapshot directly to this branch -- see that
  # step's own comment for why (external review: the paper-trading-store
  # artifact's 90-day retention is this ledger's ONLY persistence today).
  contents: write
  actions: read

env:
  UNIVERSE: RESEARCH_UNIVERSE
  START_DATE: "2024-01-02"
  MARKET_DATA_DIR: data/real_market_data
  PAPER_STORE_DIR: data/paper_trading_store
  # Workflow-level (not step-level) on purpose: a step's own `if:`
  # cannot read an `env:` block defined on that SAME step, and cannot
  # reference the `secrets` context directly at all -- confirmed via
  # GitHub's own documented workaround ("map a secret into an
  # environment variable, then reference that environment variable in
  # if:") and actions/runner issue #520. Defining it here, at the
  # workflow level, makes `env.DISCORD_WEBHOOK_URL` readable by the
  # "Send Discord notification" step's own `if:` below.
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e .

      - name: Restore previous market-data catalog artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$MARKET_DATA_DIR" "$PAPER_STORE_DIR"
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="market-data-catalog" and .expired==false)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$ART_ID" ]; then
            echo "Restoring market-data-catalog artifact $ART_ID"
            curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" -o catalog.zip
            unzip -o -q catalog.zip -d "$MARKET_DATA_DIR"
            rm -f catalog.zip
            # ADR-0115, external review N-14: actions/upload-artifact@v4
            # may wrap a single-directory upload in a subfolder named
            # after that directory instead of flattening its contents to
            # the zip root -- if the expected catalog file isn't where
            # it should be after extraction, but exactly one subfolder
            # containing it is, promote that subfolder's contents up one
            # level. Left unhandled, a wrapped zip would silently look
            # like "no prior catalog" to every downstream step, forcing
            # a full re-request every run and risking a repeat of
            # ADR-0085's rate-limit incident.
            if [ ! -f "$MARKET_DATA_DIR/catalog.duckdb" ]; then
              SUBDIRS=$(find "$MARKET_DATA_DIR" -mindepth 1 -maxdepth 1 -type d)
              SUBDIR_COUNT=$(printf '%s\n' "$SUBDIRS" | grep -c . || true)
              if [ "$SUBDIR_COUNT" = "1" ] && [ -f "$SUBDIRS/catalog.duckdb" ]; then
                echo "Artifact was wrapped in a subfolder ($SUBDIRS) -- flattening"
                cp -r "$SUBDIRS"/. "$MARKET_DATA_DIR"/
                rm -rf "$SUBDIRS"
              fi
            fi
          else
            echo "No prior market-data-catalog artifact found -- starting fresh"
          fi

      - name: Restore previous paper-trading-store artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="paper-trading-store" and .expired==false)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$ART_ID" ]; then
            echo "Restoring paper-trading-store artifact $ART_ID"
            curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" -o store.zip
            unzip -o -q store.zip -d "$PAPER_STORE_DIR"
            rm -f store.zip
            # ADR-0115, external review N-14: see the identical
            # market-data-catalog restore step's own comment above.
            if [ ! -f "$PAPER_STORE_DIR/catalog.duckdb" ]; then
              SUBDIRS=$(find "$PAPER_STORE_DIR" -mindepth 1 -maxdepth 1 -type d)
              SUBDIR_COUNT=$(printf '%s\n' "$SUBDIRS" | grep -c . || true)
              if [ "$SUBDIR_COUNT" = "1" ] && [ -f "$SUBDIRS/catalog.duckdb" ]; then
                echo "Artifact was wrapped in a subfolder ($SUBDIRS) -- flattening"
                cp -r "$SUBDIRS"/. "$PAPER_STORE_DIR"/
                rm -rf "$SUBDIRS"
              fi
            fi
          else
            echo "No prior paper-trading-store artifact found -- starting fresh"
          fi

      - name: Determine incremental ingestion start date
        id: ingest_start
        run: |
          echo "start=$(python3 scripts/compute_incremental_ingestion_start.py --db-path "$MARKET_DATA_DIR" --fallback-start "$START_DATE" --universe "$UNIVERSE")" >> "$GITHUB_OUTPUT"

      - name: Ingest latest market data
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
        run: |
          python3 scripts/ingest_real_market_data.py \
            --universe "$UNIVERSE" \
            --start "${{ steps.ingest_start.outputs.start }}" --end "$(date -u +%F)" \
            --db-path "$MARKET_DATA_DIR" \
            --manifest-out "$MARKET_DATA_DIR/ingestion_manifest.json"

      - name: Run paper trading cycle (--resume)
        run: |
          python3 scripts/run_paper_trading_cycle.py \
            --universe "$UNIVERSE" --db-path "$MARKET_DATA_DIR" \
            --paper-store "$PAPER_STORE_DIR" --resume \
            --start "$START_DATE" --end "$(date -u +%F)" \
            --max-sector-weight 0.25 --max-order-notional 1000 \
            --out paper_trading_cycle_report.json

      - name: Upload updated market-data catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-catalog
          path: ${{ env.MARKET_DATA_DIR }}
          retention-days: 90

      - name: Upload updated paper-trading store
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-store
          path: ${{ env.PAPER_STORE_DIR }}
          retention-days: 90

      # External review ("Paper Trading 100-point evaluation" report):
      # the paper-trading-store artifact above is this ledger's ONLY
      # persistence -- if scheduled runs fail for 90+ consecutive days,
      # the artifact expires and the entire order/fill/trade history is
      # gone with nothing to restore from. This step exports every table
      # in that DuckDB catalog to plain JSON (scripts/export_paper_
      # store_backup.py) and commits it directly to this branch, a
      # durable, git-native backup with no expiry. Each run OVERWRITES
      # the previous snapshot (never accumulates one folder per day) --
      # the committed files are always a complete, standalone restore
      # point, and a no-op run (nothing changed since last time) commits
      # nothing. `if: always()`: even a failed cycle run leaves whatever
      # state existed before it worth backing up.
      - name: Export and commit Paper Trading store backup
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/export_paper_store_backup.py \
            --paper-store "$PAPER_STORE_DIR" \
            --out-dir backups/paper_trading_store
          if [ -n "$(git status --porcelain backups/paper_trading_store)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add backups/paper_trading_store
            git commit -m "Update Paper Trading store backup snapshot [skip ci]"
            git push
          else
            echo "No change to the backup snapshot since last run -- nothing to commit"
          fi

      - name: Upload this run's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-cycle-report-${{ github.run_id }}
          path: paper_trading_cycle_report.json
          retention-days: 90

      # Session 38 (account owner's own request: 페이퍼 트레이딩 데일리
      # 사이클 리포트를 클로드 앱이 아니라 디스코드로도 받고 싶다). Runs
      # only once a real DISCORD_WEBHOOK_URL repo secret exists -- until
      # then this step is skipped rather than failing the whole job, so
      # merging this workflow change does not require the secret to
      # already be configured. `if: always()` on the run step above
      # means paper_trading_cycle_report.json may exist even after an
      # earlier step failed; this step still attempts to send whatever
      # was written.
      #
      # Session 38 continued (external review, verified against GitHub's
      # own docs/actions-runner#520 before fixing): the `secrets` context
      # is NOT a valid reference inside a step's own `if:` -- this
      # originally read `if: always() && secrets.DISCORD_WEBHOOK_URL != ''`,
      # which GitHub Actions rejects at workflow-parse time ("Unrecognized
      # named-value: 'secrets'"), invalidating this ENTIRE workflow run,
      # not just this one step. Fixed by reading the workflow-level
      # `env.DISCORD_WEBHOOK_URL` (set above from the same secret) instead
      # -- `DISCORD_WEBHOOK_URL` is no longer redeclared in this step's own
      # `env:` since the workflow-level one above already covers `run:`.
      - name: Send Discord notification
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          python3 scripts/send_discord_notification.py \
            --report paper_trading_cycle_report.json \
            --report-type paper_trading_cycle
