# One-shot reconnaissance: do Finnhub, SiftingIO and Quotient's real
# free-tier APIs return usable historical daily OHLCV for a
# delisted/bankrupt US stock (LEH) inside the 2000-2016-07-11
# survivorship-bias research window? See
# scripts/recon_new_survivorship_providers.py's own module docstring
# for the full "why".
#
# workflow_dispatch-only, one-shot -- delete or repurpose once the real
# answer is known and the actual provider-wiring approach is decided.
name: Recon New Survivorship Providers

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Run reconnaissance (no parsing, just real status/body observation)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SIFTINGIO_API_KEY: ${{ secrets.SIFTINGIO_API_KEY }}
          QUOTIENT_API_KEY: ${{ secrets.QUOTIENT_API_KEY }}
        run: python3 scripts/recon_new_survivorship_providers.py
